
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web</title>

    <!-- Conexión con los estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">
        <section class="calculadora">

            <header class="encabezado">
                <h1>Calculadora</h1>
                <p>Calculadora web básica</p>
            </header>

            <!-- Pantalla de la calculadora -->
            <div class="pantalla">
                <div id="operacion" class="operacion"></div>
                <div id="resultado" class="resultado">0</div>
            </div>

            <!-- Botones -->
            <div class="botones">

                <button class="funcion" data-accion="limpiar">AC</button>
                <button class="funcion" data-accion="borrar">DEL</button>
                <button class="funcion" data-accion="porcentaje">%</button>
                <button class="operador" data-valor="/">÷</button>

                <button data-valor="7">7</button>
                <button data-valor="8">8</button>
                <button data-valor="9">9</button>
                <button class="operador" data-valor="*">×</button>

                <button data-valor="4">4</button>
                <button data-valor="5">5</button>
                <button data-valor="6">6</button>
                <button class="operador" data-valor="-">−</button>

                <button data-valor="1">1</button>
                <button data-valor="2">2</button>
                <button data-valor="3">3</button>
                <button class="operador" data-valor="+">+</button>

                <button class="cero" data-valor="0">0</button>
                <button data-accion="decimal">.</button>
                <button class="igual" data-accion="calcular">=</button>

            </div>

            <footer>
                <p>Desarrollada con HTML, CSS y JavaScript</p>
            </footer>

        </section>
    </main>

    <!-- Conexión con JavaScript -->
    <script src="script.js"></script>

</body>
</html>
